<title>Work Guide — Οδηγός Εργασίας</title>
<style>
:root{--ink:#14162f;--sub:#5b627c;--purple:#6744f5;--lav:#eee8ff;--edge:#e9e9f3}
*{box-sizing:border-box}body{margin:0;background:#eae9ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ad9aff;outline-offset:2px}
.stage{min-height:100dvh;display:grid;place-items:center;padding:24px}
.phone{width:min(100%,430px);height:min(852px,calc(100dvh - 48px));min-height:560px;border:8px solid #111521;border-radius:48px;background:#fff;box-shadow:0 20px 70px #2d20544d;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#0b1020;width:115px;height:27px;border-radius:30px;z-index:8;pointer-events:none}
.status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 27px;font-size:13px;font-weight:700;position:relative;z-index:3;flex-shrink:0}.status.light{background:#5f81ed;color:white}.status .signal{letter-spacing:1px}
.main{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;background:#fbfbff}.main::-webkit-scrollbar{display:none}
.hero{background:linear-gradient(140deg,#537de6 0%,#625ce6 52%,#8553e5 100%);color:white;min-height:274px;padding:21px 20px 25px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-50px;bottom:-55px;width:310px;height:160px;border-radius:50%;background:#ffffff12;transform:rotate(-20deg)}.hero>*{position:relative}
.topline{display:flex;align-items:center;gap:12px}.appicon{width:53px;height:53px;border-radius:13px;background:#ffffff2a;display:grid;place-items:center;font-size:29px;color:#fff}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.caption{font-size:13px;opacity:.88;margin-top:1px}.bell{margin-left:auto;border:0;background:transparent;color:white;font-size:26px;position:relative;display:grid;place-items:center;width:42px;height:42px}.dot{position:absolute;background:#ff677c;border:2px solid white;width:11px;height:11px;right:4px;top:1px;border-radius:50%}
h1{font-size:30px;letter-spacing:-1.2px;margin:25px 0 5px;line-height:1.12}.hero p{margin:0;font-size:16px;line-height:1.35;max-width:300px;opacity:.93}.searchbox{margin-top:21px;background:#fff;color:#78809a;display:flex;align-items:center;gap:10px;border-radius:16px;padding:0 15px;height:48px;border:0;width:100%;text-align:left;box-shadow:0 4px 15px #302c7622;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:15px 15px 23px}.tile{border:0;border-radius:21px;min-height:123px;padding:16px 14px 12px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;color:#101326}.tile .tileIcon{display:flex;align-items:center;justify-content:flex-start;line-height:1.1}.tilehead{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-top:10px}.tiledesc{font-size:11.8px;margin-top:3px;color:#3d455d}.tile .tilearrow{position:absolute;right:14px;top:35px;display:flex}.tile{position:relative}.tilecopy{margin-top:auto}.c-blue{background:linear-gradient(120deg,#edf5ff,#dbeafa);color:#155ac9}.c-purple{background:linear-gradient(120deg,#f4ecff,#e9dffc);color:#5d30d7}.c-green{background:linear-gradient(120deg,#eafbf1,#def5e9);color:#078847}.c-peach{background:linear-gradient(120deg,#fff2e9,#ffeada);color:#a85f0b}.c-cyan{background:linear-gradient(120deg,#eaf3ff,#dceaff);color:#155aca}.c-pink{background:linear-gradient(120deg,#fff0f7,#ffe0f0);color:#cf2c6b}.tile .tilehead,.tile .tiledesc{color:#141629}.appicon,.leadIcon,.back{display:flex;align-items:center;justify-content:center}
.nav{border-top:1px solid var(--edge);display:grid;grid-template-columns:repeat(4,1fr);background:white;padding:10px 7px max(12px,env(safe-area-inset-bottom));flex-shrink:0}.nav button{border:0;background:transparent;color:#38405c;display:grid;justify-items:center;gap:3px;font-size:11px}.nav svg{display:block}.nav button.active{color:#613ef4;font-weight:750}
.head{padding:18px 20px 17px;background:white;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--edge)}.back{border:0;background:#f2efff;color:#5f45d6;width:37px;height:37px;border-radius:12px;font-size:21px}.head strong{font-size:20px;letter-spacing:-.6px}.screenContent{padding:20px 16px 28px}.searchInput{width:100%;background:#fff;border:1px solid #e1e2ee;border-radius:14px;padding:14px 16px;outline:0;font-size:14px}.pillrow{display:flex;gap:8px;overflow-x:auto;padding:16px 0 8px}.pill{border:0;border-radius:30px;background:#f1f1f8;padding:9px 13px;font-size:12px;white-space:nowrap;color:#222944}.pill.selected{background:#6946f4;color:#fff}.entry{border:1px solid #e8e8f0;background:white;border-radius:16px;padding:16px;margin-top:11px;text-align:left;width:100%;display:flex;align-items:center;gap:13px;box-shadow:0 3px 12px #25256108}.entry .sym{height:44px;min-width:44px;border-radius:13px;display:grid;place-items:center;background:#f0edff;font-size:23px;color:#653cef}.entry .enTitle{font-weight:800;font-size:14px}.entry .enDesc{color:#6a7185;font-size:12px;margin-top:4px;line-height:1.4}.entry .chev{margin-left:auto;color:#6857be;font-size:20px}.leadIcon{width:67px;height:67px;border-radius:20px;background:#edecff;display:grid;place-items:center;color:#5639d4;font-size:35px}.detailTitle{font-size:24px;line-height:1.2;letter-spacing:-.7px;margin:16px 0 6px}.detailSub{font-size:14px;color:#687086;margin:0 0 17px;line-height:1.45}.step{border:1px solid #e7e7ee;background:white;border-radius:17px;padding:15px 13px;margin-bottom:10px;display:flex;gap:11px}.number{background:#6150f2;color:white;width:27px;min-width:27px;height:27px;display:grid;place-items:center;border-radius:50%;font-size:13px;font-weight:800}.tip strong{display:flex;gap:8px;align-items:center}.step strong{font-size:14px}.step p{font-size:12.5px;color:#515872;line-height:1.45;margin:4px 0 0}.tip{border-radius:17px;background:#e5f7ed;padding:17px;margin-top:17px}.tip strong{color:#126b35}.tip p{margin:6px 0 0;font-size:13px;line-height:1.5}.faq{border:1px solid #e6e6ed;border-radius:14px;background:white;padding:0;margin:9px 0;overflow:hidden}.faq button{border:0;background:transparent;padding:16px;text-align:left;width:100%;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px}.faq p{border-top:1px solid #eeedf3;margin:0;padding:13px 16px 17px;color:#41475c;font-size:13px;line-height:1.55}.empty{padding:34px 10px;color:#666b83;text-align:center;font-size:14px}.smallNote{color:#73768f;font-size:12px;line-height:1.5;padding:9px 2px}
@media (max-width:480px){.stage{padding:0;display:block}.phone{width:100%;height:100dvh;max-height:none;min-height:0;border:none;border-radius:0;box-shadow:none}.notch,.status{display:none}.hero{min-height:270px}.tiles{padding-bottom:24px}}
@media (display-mode:standalone){.stage{padding:0;display:block}.phone{width:100%;max-width:none;height:100dvh;max-height:none;min-height:0;border:none;border-radius:0;box-shadow:none;background:#5e70df;padding-top:env(safe-area-inset-top)}.notch,.status{display:none}.nav{padding-bottom:max(12px,env(safe-area-inset-bottom));}}
textarea{font:inherit;resize:vertical;min-height:140px;width:100%;border:1px solid #dce0ed;border-radius:14px;padding:14px;line-height:1.5;color:#252940;background:#fff;outline-offset:2px}
.noteLabel{display:block;font-weight:800;font-size:15px;margin-bottom:10px}.noteHint{color:#6a7185;font-size:12px;line-height:1.55;margin-top:10px}.tag{font-size:11px;color:#19844c;background:#e6f8ee;display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;font-weight:700;margin-top:12px}
.installSteps{padding-left:20px;font-size:13px;line-height:1.8;color:#4d5369}.installSteps li{padding-left:3px}.muted{font-size:13px;color:#646a80;line-height:1.6}.sectionLabel{font-size:13px;color:#6d738d;font-weight:700;margin:22px 2px 8px}
@media(min-width:481px){.phone{max-height:852px}}
@media (prefers-reduced-motion:no-preference){.tile,.entry,.pill{transition:transform .15s ease,box-shadow .15s ease}.tile:active,.entry:active{transform:scale(.985)}}
</style>
</head>
<body>
<div class="stage"><div class="phone"><div class="notch"></div><div id="status" class="status light"><span>10:24</span><span class="signal">▂▅▇ ◉ ▰</span></div><main id="main" class="main"></main><nav class="nav" id="nav"></nav></div></div>
<script>
const vectorPaths={
 'book-open':'<path d="M12 7v14"/><path d="M12 6.7C9.5 4.9 6.3 4.3 3 5.1V20c3.6-.9 6.9-.3 9 1.2"/><path d="M12 6.7c2.5-1.8 5.7-2.4 9-1.6V20c-3.6-.9-6.9-.3-9 1.2"/>',
 'square-check':'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7.5 12 3.1 3.1 6.1-6.5"/>',
 'users':'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 'circle-help':'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-2.9 2.5-2.9 4.5"/><path d="M12 17.6h.01"/>',
 'tools':'<path d="m14.1 6.7-1.7-1.7 2.8-2.8a4.6 4.6 0 0 0-5.8 5.8L3 14.4a2 2 0 0 0 0 2.8L6.8 21a2 2 0 0 0 2.8 0l6.4-6.4a4.6 4.6 0 0 0 5.8-5.8l-2.8 2.8-1.7-1.7"/><path d="m3 3 18 18"/><path d="m4 3-1 1"/>',
 'megaphone':'<path d="M3 11v2a2 2 0 0 0 2 2h2l2.1 5.3a1.6 1.6 0 0 0 3-.8L10.3 15H12l9 5V4l-9 5H5a2 2 0 0 0-2 2Z"/><path d="M21 9a3 3 0 0 1 0 6"/>',
 'briefcase':'<rect x="2.7" y="7.2" width="18.6" height="14" rx="2.4"/><path d="M8 7.1V4.7A1.7 1.7 0 0 1 9.7 3h4.6A1.7 1.7 0 0 1 16 4.7v2.4"/><path d="M2.7 12.5a22 22 0 0 0 18.6 0M10 14v3h4v-3"/>',
 'bell':'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
 'search':'<circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/>',
 'house':'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5.3v-7H9.3v7H4a1 1 0 0 1-1-1z"/>',
 'star':'<path d="m12 2.8 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5-5.8-3.1-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9Z"/>',
 'user':'<circle cx="12" cy="7.5" r="4.1"/><path d="M4.3 21v-2a7.7 7.7 0 0 1 15.4 0v2Z"/>',
 'clipboard':'<rect x="5" y="5" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="5" rx="1"/><path d="M9 12h6m-6 4h6"/>',
 'chevron-right':'<path d="m9 6 6 6-6 6"/>',
 'arrow-left':'<path d="m15 18-6-6 6-6M9 12h12"/>',
 'check':'<path d="m4 12 5 5L20 6"/>',
 'lightbulb':'<path d="M9 18h6m-5 3h4M8.3 14.8C6.9 13.8 6 12.1 6 10a6 6 0 1 1 12 0c0 2.1-.9 3.8-2.3 4.8a3 3 0 0 0-1.2 2.2h-5a3 3 0 0 0-1.2-2.2Z"/>',
 'clock':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 'settings':'<circle cx="12" cy="12" r="3"/><path d="M19.4 15.4 22 16l-1.7 3-2.6-1a8 8 0 0 1-2 1.2L15.2 22h-3.5l-.5-2.8a8 8 0 0 1-2-1.2l-2.6 1L4.9 16l2.6-1a8 8 0 0 1 0-2l-2.6-1L6.6 9l2.6 1a8 8 0 0 1 2-1.2L11.7 6h3.5l.5 2.8a8 8 0 0 1 2 1.2l2.6-1 1.7 3-2.6 1a8 8 0 0 1 0 2.4Z" transform="translate(-.4 -1.5) scale(1.03)"/>',
 'info':'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
 'layers':'<path d="m12 2-9 5 9 5 9-5-9-5Zm-9 10 9 5 9-5m-18 5 9 5 9-5"/>',
 'external-link':'<path d="M11 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6M14 3h7v7m0-7-10 10"/>',
};
function ico(name,size=28){return `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${vectorPaths[name]||vectorPaths['circle-help']}</svg>`}
const sections=[
{id:'process',icon:'book-open',title:'Διαδικασίες',desc:'Βήμα-βήμα οδηγίες',color:'c-blue'},
{id:'policy',icon:'square-check',title:'Πολιτικές',desc:'Κανόνες & οδηγίες',color:'c-purple'},
{id:'team',icon:'users',title:'Ομάδα',desc:'Επαφές & ρόλοι',color:'c-green'},
{id:'faq',icon:'circle-help',title:'Συχνές Ερωτήσεις',desc:'Γρήγορες απαντήσεις',color:'c-peach'},
{id:'tools',icon:'tools',title:'Χρήσιμα Εργαλεία',desc:'Σύνδεσμοι & εφαρμογές',color:'c-cyan'},
{id:'news',icon:'megaphone',title:'Ανακοινώσεις',desc:'Νέα & ενημερώσεις',color:'c-pink'}];
const steps=[['Σύνδεση στο σύστημα','Άνοιξε την εφαρμογή και κάνε σύνδεση με τον εταιρικό λογαριασμό.'],['Επιλογή «Νέα Παραγγελία»','Από το μενού, επίλεξε Νέα Παραγγελία.'],['Συμπλήρωση στοιχείων','Καταχώρησε τα απαραίτητα στοιχεία (πελάτης, προϊόν, ποσότητα).'],['Ολοκλήρωση','Πάτησε Αποθήκευση για να ολοκληρώσεις την παραγγελία.']];
const faqs=[['Πώς κάνω αίτηση για άδεια;','Μπες στην ενότητα «Άδειες» του εσωτερικού συστήματος, συμπλήρωσε τις ημερομηνίες και υπέβαλε την αίτηση. Αυτή είναι ενδεικτική διαδικασία — πρέπει να προσαρμοστεί στην εταιρεία σου.','Άδειες'],['Τι κάνω αν έχω πρόβλημα με το σύστημα;','Κατέγραψε το μήνυμα σφάλματος, δοκίμασε επανασύνδεση και επικοινώνησε με την τεχνική υποστήριξη.','Σύστημα'],['Πού βρίσκω τα εταιρικά έγγραφα;','Στην ενότητα «Χρήσιμα Εργαλεία» μπορείς να προσθέσεις συνδέσμους προς τα εταιρικά αρχεία.','Διαδικασίες'],['Πώς ενημερώνω τα στοιχεία μου;','Από το εταιρικό προφίλ σου. Τα ακριβή βήματα εξαρτώνται από το σύστημα της εργασίας σου.','Σύστημα'],['Σε ποιον απευθύνομαι για τεχνική υποστήριξη;','Στον υπεύθυνο IT ή στον προϊστάμενό σου, βάσει των εσωτερικών διαδικασιών.','Σύστημα']];
const APP_VERSION='1.0.0';
function storeGet(key, fallback){try{const raw=localStorage.getItem(key);return raw===null?fallback:JSON.parse(raw)}catch(e){return fallback}}
function storeSet(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
let page='home',query='',tab='Όλες',expanded=0,favorites=new Set(storeGet('wg_favorites',['neworder']));
let personalNote=storeGet('wg_personal_note','');
const main=document.getElementById('main'),nav=document.getElementById('nav'),status=document.getElementById('status');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){page=p;query='';tab='Όλες';expanded=0;render()}
function head(s){return `<div class="head"><button class="back" onclick="go('home')" aria-label="Επιστροφή">${ico('arrow-left',22)}</button><strong>${esc(s)}</strong></div>`}
function render(){
status.className='status'+(page==='home'?' light':'');let html='';
if(page==='home'){
html=`<div class="hero"><div class="topline"><div class="appicon">${ico('briefcase',34)}</div><div><div class="brand">Work Guide</div><div class="caption">Οδηγός Εργασίας</div></div><button class="bell" onclick="go('news')" aria-label="Ανακοινώσεις">${ico('bell',29)}<span class="dot"></span></button></div><h1>Καλωσήρθες! 👋</h1><p>Ο πλήρης οδηγός για τη δουλειά σου,<br>πάντα μαζί σου.</p><button class="searchbox" onclick="go('search')">${ico('search',20)} <span>Αναζήτηση (π.χ. διαδικασία, πολιτική...)</span></button></div><div class="tiles">${sections.map(s=>`<button class="tile ${s.color}" onclick="go('${s.id}')"><span class="tileIcon">${ico(s.icon,34)}</span><span class="tilearrow">${ico('chevron-right',22)}</span><div class="tilecopy"><div class="tilehead">${s.title}</div><div class="tiledesc">${s.desc}</div></div></button>`).join('')}</div>`
}
else if(page==='detail'){
html=head('Διαδικασία')+`<div class="screenContent"><div class="leadIcon">${ico('clipboard',36)}</div><h2 class="detailTitle">Διαδικασία: Νέα Παραγγελία</h2><p class="detailSub">Πώς καταχωρούμε σωστά μια νέα παραγγελία στο σύστημα.</p>${steps.map((s,i)=>`<div class="step"><div class="number">${i+1}</div><div><strong>${s[0]}</strong><p>${s[1]}</p></div></div>`).join('')}<div class="tip"><strong>${ico('lightbulb',20)} Tip</strong><p>Έλεγξε ξανά τα στοιχεία πριν την αποθήκευση για να αποφύγεις λάθη.</p></div><button class="entry" onclick="toggleFavorite('neworder')"><span class="sym">${ico('star',25)}</span><span class="enTitle">${favorites.has('neworder')?'Αφαίρεση από αγαπημένα':'Προσθήκη στα αγαπημένα'}</span></button></div>`
}
else if(page==='faq'){
html=head('Συχνές Ερωτήσεις')+`<div class="screenContent"><input class="searchInput" id="q" placeholder="Αναζήτηση στις ερωτήσεις..." value="${esc(query)}" oninput="setQuery(this.value)"/><div class="pillrow">${['Όλες','Σύστημα','Διαδικασίες','Άδειες'].map(t=>`<button class="pill ${tab===t?'selected':''}" onclick="setTab('${t}')">${t}</button>`).join('')}</div><div id="results">${faqResults()}</div></div>`
}
else if(page==='search'){
html=head('Αναζήτηση')+`<div class="screenContent"><input class="searchInput" id="q" placeholder="Τι ψάχνεις;" value="${esc(query)}" oninput="setQuery(this.value)"/><div id="results">${searchResults()}</div></div>`
}
else if(page==='notes'){
html=head('Προσωπικές σημειώσεις')+`<div class="screenContent"><div class="leadIcon">${ico('clipboard',34)}</div><h2 class="detailTitle">Οι σημειώσεις μου</h2><p class="detailSub">Γράψε εδώ όσα θέλεις να θυμάσαι από τη δουλειά.</p><label class="noteLabel" for="note">Η δική μου σημείωση</label><textarea id="note" placeholder="Γράψε τις σημειώσεις σου εδώ..." oninput="saveNote(this.value)">${esc(personalNote)}</textarea><div class="tag" id="saveState">Αποθηκεύεται στη συσκευή</div><p class="noteHint">Αποθηκεύεται μόνο σε αυτή τη συσκευή. Δεν συγχρονίζεται με άλλες και μπορεί να χαθεί αν καθαρίσεις τα δεδομένα της εφαρμογής. Μην καταχωρείς κωδικούς ή ευαίσθητα εταιρικά δεδομένα.</p></div>`
}
else if(page==='install'){
html=head('Στο iPhone μου')+`<div class="screenContent"><div class="leadIcon">${ico('house',34)}</div><h2 class="detailTitle">Work Guide στην Αφετηρία</h2><p class="detailSub">Πρόσθεσε την εφαρμογή στην αρχική οθόνη του iPhone, για να ανοίγει χωρίς τη γραμμή του Safari.</p><ol class="installSteps"><li>Άνοιξε τη δημοσιευμένη διεύθυνση του Work Guide από το Safari.</li><li>Πάτησε Κοινοποίηση (ή Μενού σελίδας → Κοινοποίηση).</li><li>Επίλεξε «Προσθήκη στην οθόνη Αφετηρίας».</li><li>Ενεργοποίησε «Άνοιγμα ως Web App» και πάτησε «Προσθήκη».</li></ol><div class="tip"><strong>${ico('lightbulb',20)} Χρήσιμο</strong><p>Μετά το πρώτο άνοιγμα online, ο οδηγός θα μπορεί να ανοίγει και χωρίς σύνδεση χάρη στην αποθήκευση για offline χρήση.</p></div></div>`
}
else if(page==='favorites'){
html=head('Αγαπημένα')+`<div class="screenContent">${favorites.size?`<button class="entry" onclick="go('detail')"><span class="sym">${ico('clipboard')}</span><span><div class="enTitle">Νέα Παραγγελία</div><div class="enDesc">Αποθηκευμένη διαδικασία</div></span><span class="chev">${ico('chevron-right',18)}</span></button>`:'<div class="empty">Δεν έχεις αποθηκεύσει ακόμα οδηγίες.<br>Άνοιξε μια διαδικασία και πάτησε «Προσθήκη στα αγαπημένα».</div>'}</div>`
}
else if(page==='profile'){
html=head('Προφίλ')+`<div class="screenContent"><div class="leadIcon">${ico('user',35)}</div><h2 class="detailTitle">Το προφίλ μου</h2><p class="detailSub">Προσωπικές ρυθμίσεις και στοιχεία χρήστη.</p>${miniRow('settings','Γλώσσα','Ελληνικά')}${miniRow('info','Σχετικά με την εφαρμογή','Work Guide · Demo 1.1')}${miniRow('clipboard','Προσωπικές σημειώσεις','Αποθήκευση μόνο στη δική σου συσκευή','notes')}${miniRow('house','Προσθήκη στην Αφετηρία','Οδηγίες εγκατάστασης στο iPhone','install')}<p class="smallNote">Έκδοση ${APP_VERSION}. Το περιεχόμενο των διαδικασιών είναι ενδεικτικό και μπορεί να προσαρμοστεί στη δική σου εργασία.</p></div>`
}
else{
let s=sections.find(s=>s.id===page);html=head(s?.title||'Οδηγός')+`<div class="screenContent"><div class="leadIcon">${ico(s?.icon||'clipboard',35)}</div><h2 class="detailTitle">${s?.title||''}</h2><p class="detailSub">${s?.desc||''}</p>${contentFor(page)}</div>`
}
main.innerHTML=html;
nav.innerHTML=[['home','house','Αρχική'],['process','book-open','Οδηγός'],['favorites','star','Αγαπημένα'],['profile','user','Προφίλ']].map(([id,ic,label])=>`<button onclick="go('${id}')" class="${(page===id||(id==='process'&&page==='detail'))?'active':''}">${ico(ic,25)}<span>${label}</span></button>`).join('');main.scrollTop=0;
}
function miniRow(icon,title,desc,dest){return `<${dest?'button':'div'} class="entry" ${dest?`onclick="go('${dest}')"`:''}><span class="sym">${ico(icon,25)}</span><span><div class="enTitle">${title}</div><div class="enDesc">${desc}</div></span>${dest?`<span class="chev">${ico('chevron-right',18)}</span>`:''}</${dest?'button':'div'}>`}
function contentFor(id){
if(id==='process')return miniRow('clipboard','Νέα Παραγγελία','4 βήματα · Οδηγός διαδικασίας','detail')+'<div class="smallNote">Δείγμα διαδικασίας για το preview. Στην τελική έκδοση θα μπουν οι πραγματικές οδηγίες της δουλειάς.</div>';
if(id==='policy')return miniRow('square-check','Εσωτερικοί κανονισμοί','Προσθήκη πραγματικών πολιτικών της εταιρείας.')+miniRow('clock','Ωράριο & άδειες','Κανόνες και ενδεικτικά βήματα αιτήσεων.');
if(id==='team')return miniRow('users','Η ομάδα μου','Εδώ θα εμφανίζονται ονόματα, ρόλοι και τηλέφωνα.');
if(id==='tools')return miniRow('external-link','Εταιρικά εργαλεία','Σύνδεσμοι προς εργαλεία και έγγραφα.');
if(id==='news')return miniRow('bell','Καλώς ήρθες στο Work Guide!','Το demo είναι έτοιμο. Οι πραγματικές ανακοινώσεις θα εμφανίζονται εδώ.');
return '';
}
function faqResults(){let filtered=faqs.map((f,i)=>[...f,i]).filter(f=>(tab==='Όλες'||f[2]===tab)&&(f[0]+' '+f[1]).toLocaleLowerCase('el').includes(query.toLocaleLowerCase('el')));return filtered.length?filtered.map(f=>`<div class="faq"><button onclick="openFaq(${f[3]})">${f[0]}<span>${expanded===f[3]?'⌃':'⌄'}</span></button>${expanded===f[3]?`<p>${f[1]}</p>`:''}</div>`).join(''):'<div class="empty">Δεν βρέθηκαν ερωτήσεις.</div>'}
function searchResults(){let q=query.toLocaleLowerCase('el').trim();let items=[['clipboard','Νέα Παραγγελία','Οδηγίες βήμα-βήμα','detail'],...sections.map(s=>[s.icon,s.title,s.desc,s.id]),...faqs.map(f=>['circle-help',f[0],f[1],'faq'])];let matches=items.filter(x=>!q||(x[1]+' '+x[2]).toLocaleLowerCase('el').includes(q));return matches.length?matches.map(x=>miniRow(x[0],esc(x[1]),esc(x[2]),x[3])).join(''):'<div class="empty">Δεν βρέθηκαν αποτελέσματα.</div>'}
function setQuery(v){query=v;let el=document.getElementById('results');if(el)el.innerHTML=page==='faq'?faqResults():searchResults()}
function setTab(t){tab=t;expanded=-1;let st=main.scrollTop;render();main.scrollTop=st}
function openFaq(i){expanded=expanded===i?-1:i;let st=main.scrollTop;render();main.scrollTop=st}
function toggleFavorite(id){favorites.has(id)?favorites.delete(id):favorites.add(id);storeSet('wg_favorites',[...favorites]);render()}
function saveNote(v){personalNote=v;storeSet('wg_personal_note',v);const el=document.getElementById('saveState');if(el)el.textContent='Αποθηκεύτηκε στη συσκευή'}
render();
if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Service worker:',err)));
}
</script>
</body>
</html>
