<!doctype html>
<html lang="el"><head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Work Guide — Σύνδεση</title>
<style>
:root{color-scheme:light;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eff1ff;color:#192044}body{min-height:100dvh;display:grid;place-items:center;padding:max(22px,env(safe-area-inset-top)) 18px max(22px,env(safe-area-inset-bottom))}
.shell{width:min(100%,415px);min-height:580px;border-radius:32px;background:#fff;overflow:hidden;box-shadow:0 16px 58px #4e468d2a;display:flex;flex-direction:column}
.head{background:linear-gradient(135deg,#9e52e6 0%,#813acc 58%,#6030aa 100%);color:#fff;padding:40px 30px 47px;position:relative;isolation:isolate;overflow:hidden}
.head:after{content:"";position:absolute;z-index:-1;width:290px;height:220px;border-radius:50%;background:#ffffff17;right:-110px;bottom:-140px}
.brand{display:flex;align-items:center;gap:14px}.brand-icon{height:62px;width:62px;display:grid;place-items:center;border-radius:18px;background:#ffffff36;border:1px solid #ffffff48;box-shadow:0 7px 18px #19117f20}.brand-icon svg{height:39px;width:39px;stroke:#fff}.brand b{font-size:27px;letter-spacing:-.8px}.brand span{font-size:13px;opacity:.88;display:block;margin-top:3px}
h1{font-size:28px;letter-spacing:-1px;margin:34px 0 8px}.head p{font-size:14px;line-height:1.55;opacity:.95;margin:0}
.form{padding:31px 27px 36px;flex:1;display:flex;flex-direction:column;gap:10px}label{font-size:13px;font-weight:750;color:#333953}
.passrow{display:flex;align-items:center;border:1px solid #dedfec;border-radius:14px;overflow:hidden;background:#fbfaff;transition:border-color .2s}.passrow:focus-within{border-color:#6954e9;box-shadow:0 0 0 3px #6753e719}.passrow input{background:transparent;flex:1;border:0;padding:16px 13px;width:50%;font-size:15px;outline:none;color:#1a1b2e}.passrow button{border:0;background:none;padding:12px;color:#595e81;cursor:pointer;font-size:13px}
.submit{margin-top:12px;border:0;border-radius:14px;background:#634cef;color:#fff;height:50px;font-size:15px;font-weight:750;cursor:pointer;box-shadow:0 8px 18px #6144f132}.submit:disabled{opacity:.65;cursor:wait}#msg{min-height:21px;font-size:12px;line-height:1.5;color:#ad3153;margin:0}.explain{font-size:12px;color:#686b86;line-height:1.5;margin-top:auto;padding-top:22px}.foot{color:#777c97;font-size:11px;text-align:center;padding:0 12px 23px}
@media(max-width:480px){body{padding:0;display:block;background:#fff}.shell{width:100%;max-width:none;min-height:100dvh;border-radius:0;box-shadow:none}.head{padding-top:max(40px,calc(env(safe-area-inset-top) + 28px))}.form{padding:33px 24px 22px}}
</style></head><body>
<div class="shell"><header class="head"><div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2.3"/><path d="M8 7V5.3A2.3 2.3 0 0 1 10.3 3h3.4A2.3 2.3 0 0 1 16 5.3V7M3 12h18m-11 0v2h4v-2"/></svg></div><div><b>Work Guide</b><span>Οδηγός Εργασίας</span></div></div><h1>Καλώς ήρθες! 👋</h1><p>Ο προσωπικός σου οδηγός, προστατευμένος με κωδικό πρόσβασης.</p></header>
<main class="form"><form id="unlock"><label for="password">Κωδικός πρόσβασης</label><div class="passrow"><input id="password" name="password" type="password" autocomplete="off" minlength="1" required autofocus placeholder="Πληκτρολόγησε τον κωδικό σου"/><button type="button" id="toggle" aria-label="Εμφάνιση κωδικού">Εμφάνιση</button></div><button type="submit" class="submit" id="submit">🔒 Ξεκλείδωμα εφαρμογής</button><p id="msg" role="status" aria-live="polite"></p></form><p class="explain">Την πρώτη φορά πληκτρολογείς τον κωδικό. Το συγκεκριμένο iPhone θα θυμάται την πρόσβαση, εκτός αν το κλειδώσεις ξανά ή διαγράψεις τα δεδομένα της εφαρμογής.</p></main><div class="foot">Work Guide · Προσωπική πρόσβαση</div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), form=$('unlock'), pwd=$('password'), btn=$('submit'), msg=$('msg');
const DB='workguide-device-unlock-v1', STORE='deviceKeys', KEY='deviceKey';
let unlocking=false;
function openDb(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB){reject(new Error('Δεν υποστηρίζεται η μνήμη συσκευής.'));return;}
  const request=indexedDB.open(DB,1);
  request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(STORE))request.result.createObjectStore(STORE)};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('Αδυναμία IndexedDB'));
 });
}
async function dbOperation(method,value){
 const db=await openDb();
 try{return await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,method==='get'?'readonly':'readwrite');
  const request=method==='get'?tx.objectStore(STORE).get(KEY):method==='put'?tx.objectStore(STORE).put(value,KEY):tx.objectStore(STORE).delete(KEY);
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('Αποτυχία αποθήκευσης'));
  tx.onabort=()=>reject(tx.error||new Error('Αποτυχία βάσης'));
 })}finally{db.close()}
}
// Exposed only after successful unlock; used by the voluntary "Lock this device" button.
window.wgForgetDevice=async()=>{try{await dbOperation('delete')}catch(e){console.warn('Αποτυχία διαγραφής κλειδιού:',e);alert('Δεν διαγράφηκε το αποθηκευμένο κλειδί. Έλεγξε τον αποθηκευτικό χώρο του Safari.');return;}location.reload()};
const decoder=new TextDecoder(), encoder=new TextEncoder();
async function getEncrypted(){
 if(!self.crypto?.subtle)throw Error('Χρειάζεται HTTPS για ασφαλή λειτουργία.');
 const response=await fetch('./content.enc',{cache:'no-store'});
 if(!response.ok)throw Error('Δεν βρέθηκε το κρυπτογραφημένο περιεχόμενο.');
 const bytes=new Uint8Array(await response.arrayBuffer());
 if(bytes.length<48||decoder.decode(bytes.slice(0,4))!=='WGL2')throw Error('Το αρχείο της εφαρμογής δεν είναι έγκυρο.');
 return {salt:bytes.slice(4,20),iv:bytes.slice(20,32),cipher:bytes.slice(32)};
}
async function derive(password,salt){
 const material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function decrypt(key,packet){return decoder.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:packet.iv,additionalData:encoder.encode('workguide-v2-locked')},key,packet.cipher))}
function openApp(html,key){
 // The old edition forcibly locked on backgrounding. Remove only that obsolete behavior.
 html=html.replace(/<style id="wg-relock-style">[\s\S]*?<\/script>/,'');
 // Load the original procedure editor and the updated visual layer AFTER decrypting.
 const extras='<link rel="stylesheet" href="./wg-theme-v6.2.css">'+
 '<script src="./lucide.min.js?v=6"><'+'/script>'+
 '<script src="./wg-secure-store.js?v=6"><'+'/script>'+
 '<script src="./wg-app-v6.2.js"><'+'/script>';
 const composed=html.replace(/<\/body>/i,extras+'</body>');
 window.__wgProcedureKey=key;
 pwd.value='';
 document.open();document.write(composed);document.close();
}
function message(text){msg.textContent=text;}
function busy(value,label){unlocking=value;btn.disabled=value;btn.textContent=label}
$('toggle').addEventListener('click',()=>{const visible=pwd.type==='text';pwd.type=visible?'password':'text';$('toggle').textContent=visible?'Εμφάνιση':'Απόκρυψη'});
form.addEventListener('submit',async e=>{
 e.preventDefault();if(unlocking||!pwd.value)return;
 busy(true,'Έλεγχος κωδικού…');message('');
 try{
  const packet=await getEncrypted();
  const key=await derive(pwd.value,packet.salt);
  let html;try{html=await decrypt(key,packet)}catch(e){throw Error('Λάθος κωδικός. Δοκίμασε ξανά.')}
  // Don't block access if the device refuses persistent key storage.
  try{await dbOperation('put',key)}catch(e){console.warn('Remember device unavailable',e)}
  openApp(html,key);
 }catch(e){message(e.message||'Αδυναμία ξεκλειδώματος.');busy(false,'🔒 Ξεκλείδωμα εφαρμογής');pwd.select()}
});
// Automatic unlock if the saved AES key still decrypts the currently deployed file.
(async()=>{
 message('Έλεγχος αυτής της συσκευής…');
 let key;try{key=await dbOperation('get')}catch(e){message('');return;}
 if(!key){message('');return;}
 busy(true,'Άνοιγμα Work Guide…');
 try{const packet=await getEncrypted();const html=await decrypt(key,packet);openApp(html,key)}
 catch(e){
  console.warn('Απαιτείται νέα επιβεβαίωση κωδικού.',e);
  try{await dbOperation('delete')}catch(_e){}
  busy(false,'🔒 Ξεκλείδωμα εφαρμογής');message('Χρειάζεται ξανά κωδικός (π.χ. επειδή άλλαξε ή καθαρίστηκαν τα δεδομένα).');
 }
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(registration=>registration.update()).catch(()=>{});
}
})();
</script></body></html>
